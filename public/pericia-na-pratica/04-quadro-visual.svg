<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="quadro-04-titulo quadro-04-descricao" focusable="false" xml:lang="pt-BR">
<title id="quadro-04-titulo">Documentos fiscais: XML da NF-e, DANFE e relatório derivado</title>
<desc id="quadro-04-descricao">XML da NF-e: Arquivo digital com informações organizadas em campos. DANFE: Representação gráfica simplificada relacionada à NF-e pela chave de acesso. Relatório derivado: Confira a base, o período, os filtros e os critérios de cálculo. Identifique as fontes antes de interpretar a divergência.</desc>
