<path d="M64 207V347" fill="none" stroke="#276B59" stroke-width="4"/>
<g transform="translate(104 232)" fill="none" stroke="#276B59" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 17-16 15 16 15M43 17l16 15-16 15M37 10 28 54"/></g>
