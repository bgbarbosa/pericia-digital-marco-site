<title id="quadro-01-titulo">Mensagens digitais: contexto, sequência e origem</title>
<desc id="quadro-01-descricao">Contexto: Quais trechos anteriores e posteriores ajudam a compreender a conversa? Sequência: Como os registros disponíveis se ordenam no período relevante? Origem: De onde veio cada material e como foi obtido ou transformado? O alcance depende do material disponível.</desc>
