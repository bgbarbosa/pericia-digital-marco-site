<title id="quadro-02-titulo">Contratação eletrônica: documento, assinatura e autenticação</title>
<desc id="quadro-02-descricao">Documento: Qual arquivo e qual versão correspondem à contratação discutida? Assinatura: Qual mecanismo foi usado e qual conteúdo está abrangido? Autenticação: Que meio foi usado para acessar a conta ou confirmar uma etapa? Cada elemento responde a uma pergunta diferente.</desc>
